- insert:
    - id: dsh-wireguard
      name: '@local/dsh-wireguard'
      config:
        controlPort: 51821
        listenPort: 51820
        vpnCidr: 10.66.66.0/24
        serverIp: 10.66.66.1
        mtu: 1420
        interfaceName: dshwg0
        endpointHost: ''
        joinCode: ''
        # Keep the OS tunnel alive when Harness exits, so a restart does not
        # drop this peer out of the mesh. Set false for old teardown behavior.
        keepTunnelOnExit: true
